<!DOCTYPE html>
<html lang="en">
<title>Breathe</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.json">
<style>
    :root {
        --background: #f0f0f0;
        --foreground: #000000;
        --timer-circle: #000000;
        --outer-circle: #cccccc;
        --inner-circle: #0e6caa;
    }

    @media (prefers-color-scheme: dark) {
        :root {
            --background: #252525;
            --foreground: #dddddd;
            --timer-circle: #dddddd;
            --outer-circle: #5a5a5a;
            --inner-circle: #0e6caa;
        }
    }

    @media (prefers-color-scheme: dark) and (prefers-contrast: more) {
        :root {
            --background: #000000;
            --foreground: #ffffff;
            --timer-circle: #ffffff;
            --outer-circle: #ffffff;
            --inner-circle: #000000;
        }
    }

    @media (prefers-color-scheme: light) and (prefers-contrast: more) {
        :root {
            --background: #ffffff;
            --foreground: #000000;
            --timer-circle: #ffffff;
            --outer-circle: #000000;
            --inner-circle: #ffffff;
        }
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background-color: var(--background);
        color: var(--foreground);
        height: 100vh;
        margin: 0;
        font-family: sans-serif;
        overflow: hidden;
        display: flex;
    }

    #app {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        margin: auto;
        flex: 0;
    }

    #instruction {
        font-size: 5vmin;
        margin-top: 5vmin;
    }

    #circle {
        border-radius: 100vmax;
        width: 85vmin;
        height: 85vmin;
        max-width: 500px;
        max-height: 500px;
    }

    @media (prefers-contrast: more) {
        #timer-circle {
            mix-blend-mode: difference;
        }
    }
</style>

<body>
    <div id="app">
        <svg id="circle" width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" id="outer-circle" cy="50" r="50" fill="var(--outer-circle)" />
            <circle cx="50" id="inner-circle" cy="50" r="50" fill="var(--inner-circle)" />
            <circle cx="50" id="timer-circle" cy="50" r="50" stroke="var(--timer-circle)" fill="none" stroke-width="3"
                transform="rotate(-90 50 50)">
            </circle>
        </svg>
        <div id="instruction"></div>
    </div>
    <script>
        const circle = document.getElementById('circle');
        const innerCircle = document.getElementById('inner-circle');
        const timerCircle = document.getElementById('timer-circle');
        const instruction = document.getElementById('instruction');

        const milliseconds = 4000;

        function createAnimation(obj, attributeName, ms) {
            const animation = document.createElementNS("http://www.w3.org/2000/svg", "animate");
            animation.setAttribute("attributeName", attributeName);
            console.log(Object.keys(obj));
            for (const key of Object.keys(obj)) {
                animation.setAttribute(key, obj[key]);
            }
            animation.setAttribute("fill", "freeze");
            animation.setAttribute("dur", ms + "ms");
            animation.setAttribute("repeatCount", "1");
            return animation;
        }

        const dashArrayNumber = 2 * Math.PI * 50;

        // 0 = breathe in
        // 1 = hold
        // 2 = breathe out
        // 3 = hold
        let state = undefined;

        const circleAnimation1 = createAnimation({ values: `${dashArrayNumber}, 0; 0, ${dashArrayNumber}` }, "stroke-dasharray", milliseconds);
        const circleAnimation2 = createAnimation({ values: `0, ${dashArrayNumber}; ${dashArrayNumber}, 0` }, "stroke-dasharray", milliseconds);
        const circleAnimationOffset = createAnimation({ from: `-${dashArrayNumber}`, to: "0" }, "stroke-dashoffset", milliseconds);


        const breatheInAnimation = createAnimation({ from: "0", to: "50", }, "r", milliseconds);
        const breatheOutAnimation = createAnimation({ from: "50", to: "0", }, "r", milliseconds);

        function vibrate() {
            try {
                if ("vibrate" in navigator) {
                    navigator.vibrate(50);
                }
            }
            catch {

            }
        }

        function instructionFrame() {
            if (state === undefined || circle.getCurrentTime() >= 4) {
                let textToRender = "";
                state = ((state || 0) + 1) % 4;

                timerCircle.innerHTML = "";
                innerCircle.innerHTML = "";
                switch (state) {
                    case 0:
                        innerCircle.appendChild(breatheInAnimation);
                        textToRender = "Breathe in";
                        timerCircle.appendChild(circleAnimation2);
                        timerCircle.appendChild(circleAnimationOffset);
                        break;
                    case 1:
                        textToRender = "Hold";
                        innerCircle.setAttribute("r", "50");
                        timerCircle.appendChild(circleAnimation1);
                        break;
                    case 2:
                        innerCircle.appendChild(breatheOutAnimation);
                        textToRender = "Breathe out";
                        timerCircle.appendChild(circleAnimation2);
                        timerCircle.appendChild(circleAnimationOffset);

                        break;
                    case 3:
                        textToRender = "Hold";
                        innerCircle.setAttribute("r", "0");
                        timerCircle.appendChild(circleAnimation1);
                        break;
                }

                circle.setCurrentTime(0);
                vibrate();

                instruction.innerText = textToRender;
            }


            requestAnimationFrame(instructionFrame);
        }

        instructionFrame();
    </script>

</body>

</html>
