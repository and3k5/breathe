<!DOCTYPE html>
<html>
<title>Breathe</title>
<style>
    body {
        background-color: #f0f0f0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #outer-circle {
        border-radius: 100vmax;
        width: 85vmin;
        height: 85vmin;
        background-color: #cccccc;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    #inner-circle {
        background-color: #0e6caa;
        border-radius: 100vmax;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 50vmin;
        line-height: 1em;
    }

    #inner-circle.breathe-in {
        animation: breathe-in 4s forwards;
        animation-timing-function: linear;
    }

    #inner-circle.breathe-out {
        animation: breathe-in 4s forwards;
        animation-direction: reverse;
        animation-timing-function: linear;
    }

    @keyframes breathe-in {
        from {
            width: 0;
            height: 0;
        }

        to {
            width: 100%;
            height: 100%;
        }
    }
</style>

<body>
    <div id="outer-circle">
        <div id="inner-circle"></div>
    </div>
    <script>
        const innerCircle = document.getElementById('inner-circle');

        // 0 = breathe in
        // 1 = hold
        // 2 = breathe out
        // 3 = hold
        let state = 0;
        let renderedNumber = "";

        let lastState = performance.now();
        function instructionFrame(now) {
            if (now - lastState > 4000) {
                lastState = now;
                state = (state + 1) % 4;
            }

            switch (state) {
                case 0:
                    innerCircle.className = 'breathe-in';
                    break;
                case 1:
                    //innerCircle.className = 'hold';
                    break;
                case 2:
                    innerCircle.className = 'breathe-out';
                    break;
                case 3:
                    //innerCircle.className = 'hold';
                    break;
            }

            const numberToRender = (1 + ~~((now - lastState) / 1000)).toString();
            if (numberToRender !== renderedNumber) {
                renderedNumber = numberToRender;
                innerCircle.innerText = numberToRender;
            }

            requestAnimationFrame(instructionFrame);
        }

        instructionFrame();
    </script>

</body>

</html>
