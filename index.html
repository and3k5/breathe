<!DOCTYPE html>
<html>
<title>Breathe</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background-color: #f0f0f0;
        height: 100vh;
        margin: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        overflow: hidden;
        display: flex;
    }

    #app {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        margin: auto;
        flex: 0;
    }

    #instruction {
        font-size: 5vmin;
        margin-top: 5vmin;
    }

    #outer-circle {
        border-radius: 100vmax;
        width: 85vmin;
        height: 85vmin;
        background-color: #cccccc;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        max-width: 500px;
        max-height: 500px;
    }

    #inner-circle {
        background-color: #0e6caa;
        border-radius: 100vmax;
        line-height: 0;
        transition: width 4s linear, height 4s linear;
    }

    #seconds {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 1em;
        height: 1em;
        font-size: min(50vmin, 280px);
        transform: translate(-25%, -5%);

    }

    #inner-circle.breathe-in {
        width: 100%;
        height: 100%;
    }

    #inner-circle.breathe-out {
        width: 0;
        height: 0;
    }
</style>

<body>
    <div id="app">
        <div id="outer-circle">
            <div id="inner-circle">
                <div id="seconds"></div>
            </div>
        </div>
        <div id="instruction"></div>
    </div>
    <script>
        const innerCircle = document.getElementById('inner-circle');
        const seconds = document.getElementById('seconds');
        const instruction = document.getElementById('instruction');

        // 0 = breathe in
        // 1 = hold
        // 2 = breathe out
        // 3 = hold
        let state = 1;
        let renderedNumber = "";
        let renderedText = "";

        let lastState = performance.now();
        function instructionFrame(now) {
            if (now - lastState > 4000) {
                lastState = now;
                state = (state + 1) % 4;
            }

            let textToRender = "";
            switch (state) {
                case 0:
                    innerCircle.className = 'breathe-in';
                    textToRender = "Breathe in";
                    break;
                case 1:
                    innerCircle.className = 'breathe-in';
                    textToRender = "Hold";
                    break;
                case 2:
                    innerCircle.className = 'breathe-out';
                    textToRender = "Breathe out";
                    break;
                case 3:
                    innerCircle.className = 'breathe-out';
                    textToRender = "Hold";
                    break;
            }

            const numberToRender = (1 + ~~((now - lastState) / 1000)).toString();
            if (numberToRender !== renderedNumber) {
                renderedNumber = numberToRender;
                seconds.innerText = numberToRender;
            }

            if (renderedText != textToRender) {
                renderedText = textToRender;
                instruction.innerText = textToRender;
            }

            requestAnimationFrame(instructionFrame);
        }

        instructionFrame();
    </script>

</body>

</html>
